<!doctype html>
<html lang="es">

    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://nodo.example/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Nodo" />
    <meta property="og:title" content="Nodo — Convertimos procesos complejos en sistemas inteligentes" />
    <meta
      property="og:description"
      content="Soluciones de IA a medida que automatizan operaciones, optimizan decisiones y crean nuevas oportunidades de crecimiento."

    <meta property="og:url" content="https://nodo.example/" />
    <meta property="og:image" content="https://nodo.example/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Visualización del sistema inteligente de Nodo: un núcleo de IA conectado a módulos empresariales." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nodo — Sistemas de IA para empresas" />

    <meta name="twitter:image" content="https://nodo.example/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://nodo.example/#org",
            "name": "Nodo",
            "url": "https://nodo.example/",
            "logo": "https://nodo.example/favicon.svg",
            "description": "Inteligencia artificial aplicada a negocios reales."
          },
          {
            "@type": "WebSite",
            "@id": "https://nodo.example/#website",
            "url": "https://nodo.example/",
            "name": "Nodo",
            "inLanguage": "es",
            "publisher": { "@id": "https://nodo.example/#org" }
          },
          {
            "@type": "ItemList",
            "name": "Soluciones de IA",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "item": { "@type": "Service", "name": "Automatización inteligente", "provider": { "@id": "https://nodo.example/#org" } } },
              { "@type": "ListItem", "position": 2, "item": { "@type": "Service", "name": "Agentes de IA", "provider": { "@id": "https://nodo.example/#org" } } },
              { "@type": "ListItem", "position": 3, "item": { "@type": "Service", "name": "Data & Intelligence", "provider": { "@id": "https://nodo.example/#org" } } },
              { "@type": "ListItem", "position": 4, "item": { "@type": "Service", "name": "Integraciones", "provider": { "@id": "https://nodo.example/#org" } } }
            ]
          }
        ]
      }
    </script>

      <p style="padding:24px;color:#e9ebee;background:#07080a;font-family:sans-serif">

    <script type="module" src="/src/main.tsx"></script>
  </body>
